# fly.toml app configuration file generated for canopy-lustrous-sun-2494 on 2026-11-17T16:56:13+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'canopy-lustrous-sun-2494'
primary_region = 'sin'
kill_signal = 'SIGTERM'

[build]


[env]
  PHX_HOST = 'canopy-lustrous-sun-2494.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
